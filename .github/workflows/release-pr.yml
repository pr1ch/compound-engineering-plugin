name: Release PR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: release-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-pr:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Detect release PR merge
        id: detect
        run: |
          MSG=$(git log -1 --format=%s)
          if [[ "$MSG" == chore:\ release* ]]; then
            echo "is_release_merge=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_release_merge=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate release metadata scripts
        if: steps.detect.outputs.is_release_merge == 'false'
        run: bun run release:validate

      - name: Maintain release PR
        id: release
        uses: googleapis/release-please-action@v4.4.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json
          skip-labeling: false

      - name: Preserve Sol/Fable-derived versions on the release PR
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          PR_NUMBER=$(jq -r '.number // empty' <<< "$RELEASE_PR")
          test -n "$PR_NUMBER"
          gh pr checkout "$PR_NUMBER"
          bun run release:sync-metadata
          bun run release:validate
          git add .claude-plugin/plugin.json .codex-plugin/plugin.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "chore: preserve Sol/Fable release metadata"
          git push
